# Model catalog for Orca worker-start --agent / --model / --effort
# Edit by hand, or: bash scripts/wdd refresh-models
# Brief: bash scripts/wdd models [--agent NAME] [--ids-only]
# Auth: bash scripts/wdd agents
#
# Upstream wish: `orca models list --agent <id> --ids-only`
#
# refreshed: 2026-11-14

defaults:
  effort:
    wiring: low
    scaffold: medium
    dense: high

antigravity:
  agent: antigravity
  notes: "Google Antigravity (agy). Prefer --model <base> --effort <level>; compound ids also work."
  effort_flag: true
  compound_model_ids:
    - gemini-3.8-flash-high
    - gemini-3.8-flash-medium
    - gemini-3.8-flash-low
  models:
    - id: gemini-3.8-flash
      efforts: [low, medium, high]
    - id: claude-sonnet-4-6
    - id: claude-opus-4-6-thinking
    - id: gpt-oss-120b-medium

claude:
  agent: claude
  notes: "Claude Code. Aliases sonnet/opus/haiku accepted. Refresh when Anthropic ships new ids."
  effort_flag: true
  models:
    - id: sonnet
      notes: "alias → latest sonnet"
    - id: opus
      notes: "alias → latest opus"
    - id: haiku
      notes: "alias → latest haiku"
    - id: claude-sonnet-4-6
    - id: claude-opus-4-6
    - id: claude-haiku-4-5
    - id: claude-opus-4-5
    - id: claude-sonnet-4-5

cursor:
  agent: cursor
  notes: "Cursor Agent CLI. Most ids encode effort (-low/-high/-fast). Pass --model only."
  effort_in_id: true
