opencode:
  agent: opencode
  notes: "OpenCode (aka openbot). Same ids for --agent opencode2. Omit --effort if host refuses it."
  effort_flag: true
  models:
    - id: opencode/beam-free
      efforts: [low, medium, high, xhigh, max, default]
    - id: opencode/big-pickle
    - id: opencode/deepseek-v4.1-flash-free
      efforts: [low, high, max, default]
    - id: opencode/flint-40b-free
      efforts: [low, medium, high, xhigh, max, default]
    - id: opencode/glm-5.3-flash-free
      efforts: [low, high, max, default]
    - id: opencode/iceman-free
    - id: opencode/inkling-2-small-free
      efforts: [none, minimal, low, medium, high, max, default]
    - id: opencode/longcat-2.5-free
    - id: opencode/mimo-v2.6-flash-free
    - id: opencode/minimax-m3.1-flash-free
      efforts: [low, medium, high, xhigh, max, default]
    - id: opencode/nemotron-3.5-lightning-free
    - id: opencode/nemotron-3.5-super-vl-free
      efforts: [none, minimal, low, medium, high, xhigh, default]

